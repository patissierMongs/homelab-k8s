apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dashboards-provider.yaml
configMapGenerator:
  - name: grafana-dashboard-llmops
    namespace: monitoring
    files:
      - llmops.json
    options:
      disableNameSuffixHash: true
  - name: grafana-dashboard-topology
    namespace: monitoring
    files:
      - topology.json
    options:
      disableNameSuffixHash: true
