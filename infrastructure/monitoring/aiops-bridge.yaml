---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-bridge
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-bridge
  template:
    metadata:
      labels:
        app: aiops-bridge
    spec:
      containers:
        - name: aiops-bridge
          image: aiops-bridge:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: OLLAMA_URL
              value: "http://ollama.llm.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: "mistral:7b"
            - name: GRAFANA_URL
              value: "http://grafana.monitoring.svc.cluster.local:3000"
            - name: LISTEN_PORT
              value: "5000"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-bridge
  namespace: monitoring
spec:
  selector:
    app: aiops-bridge
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
