---
# Ollama runs as host systemd service
# K8s service routes through priority proxy (port 11435)
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
spec:
  type: NodePort
  ports:
    - port: 11434
      targetPort: 11435
      nodePort: 31434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: llm
subsets:
  - addresses:
      - ip: 192.168.50.108
    ports:
      - port: 11435
